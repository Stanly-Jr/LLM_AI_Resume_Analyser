services:
  - type: web
    name: resumeiq
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: GOOGLE_API_KEY
        sync: false          # means: Render will NOT sync this from repo — you set it manually in dashboard
    plan: free

